<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f8f3e6">
  <meta name="description" content="Семейная игра: послушай слово, найди картинку, а потом оживи другое слово одной буквой.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='13' fill='%23edb958'/%3E%3Cpath d='m24 9 4 11 11 4-11 4-4 11-4-11-11-4 11-4z' fill='%23224135'/%3E%3C/svg%3E">
  <title>Буквоград 2.0 — Ожившие слова</title>
  <style>
:root {
  color-scheme: light;
  --ink: #213e34;
  --muted: #4e6357;
  --line: #ded8c5;
  --paper: #fffdf5;
  --warm: #f8f3e6;
  --green: #255447;
  --mint: #d9eee0;
  --gold: #f4cb70;
  --rose: #ffdcd2;
  --shadow: #ddd6c0;
  font: 16px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; color: var(--ink); background: var(--warm); background-image: radial-gradient(#a095792b 0.8px, transparent 0.8px); background-size: 19px 19px; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 3px solid #365ab2; outline-offset: 3px; }
h1[tabindex]:focus { outline: none; }
button:disabled { opacity: .62; cursor: default; }
p, h1 { margin: 0; }
svg { display: block; }
[data-icon] { display: inline-grid; flex: none; place-items: center; width: 1.25em; height: 1.25em; }
[data-icon] svg { width: 100%; height: 100%; }
.art svg, .cover-sticker svg { width: 100%; height: 100%; }
.shell { width: min(940px, 100%); margin-inline: auto; padding: 0 clamp(12px, 4vw, 30px) 28px; }
.topbar { display: flex; align-items: center; gap: 10px; min-height: 82px; }
.brand { display: flex; align-items: center; gap: 9px; margin-right: auto; min-width: 0; font-size: 19px; font-weight: 850; letter-spacing: -.035em; white-space: nowrap; }
.brand-mark { width: 34px; height: 34px; border-radius: 11px; background: #f3ce78; transform: rotate(-7deg); box-shadow: 0 2px #dbaf50; }
.brand-mark svg { width: 22px; height: 22px; }
.brand small { font: inherit; color: #5c6a54; font-size: .75em; }
.button { display: inline-flex; align-items: center; justify-content: center; gap: .5em; min-height: 48px; border: 1px solid transparent; border-radius: 15px; padding: 8px 15px; text-align: center; font-weight: 750; line-height: 1.1; }
.button:not(:disabled):active { transform: translateY(2px); }
.home-key, .sound-key { background: var(--paper); border-color: var(--line); min-width: 48px; }
.home-key { padding-inline: 10px; }
.sound-key { font-size: 14px; padding-inline: 12px; }
.sound-key[aria-pressed="false"] { background: #eee8db; }
.primary { background: var(--green); color: #fffef1; box-shadow: 0 3px #193e36; }
.secondary { background: #f8f0d7; border-color: #dfd1a7; box-shadow: 0 2px #e9ddbe; }
@media (hover: hover) {
  .primary:hover { background: #1d483d; }
  .secondary:hover, .mode-key:hover { background: #f4e6bb; }
  .picture:hover { border-color: #7fa694; }
}
.overline { display: flex; align-items: center; gap: .45em; font-size: .76rem; text-transform: uppercase; letter-spacing: .13em; font-weight: 850; }
.overline [data-icon] { width: 1.5em; height: 1.5em; }
.home-card, .station-card { border: 1px solid var(--line); border-radius: 30px; background: var(--paper); box-shadow: 0 7px var(--shadow); }
.home-card { position: relative; display: grid; grid-template-columns: 1fr .96fr; align-items: center; gap: 12px; padding: clamp(25px, 5.6vw, 55px); min-height: 450px; isolation: isolate; }
.home-copy { position: relative; z-index: 2; }
.home-copy .overline { color: #4b6547; margin-bottom: 10px; }
.home-copy .overline [data-icon] { color: #755117; }
.home-copy h1 { font-size: clamp(3.25rem, 8vw, 6.1rem); font-weight: 900; line-height: .93; letter-spacing: -.078em; }
.title-dot { color: #c45844; }
.lede { margin-top: 20px; max-width: 25ch; color: var(--muted); font-size: clamp(1rem, 2.1vw, 1.27rem); font-weight: 530; }
.home-actions, .finish-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
.home-actions > .button, .finish-actions > .button { min-height: 55px; padding-inline: 19px; }
.home-progress { margin-top: 16px; color: var(--muted); font-weight: 650; font-size: .875rem; }
.cover { position: relative; min-width: 0; justify-self: stretch; height: clamp(250px, 40vw, 343px); }
.cover-orbit { position: absolute; inset: 6% 2% 6%; border-radius: 47% 53% 45% 53%; background: #eee2b3; background-image: radial-gradient(#bca56a8c 1px, transparent 1px); background-size: 13px 13px; transform: rotate(-8deg); }
.cover-sticker { position: absolute; width: 67%; aspect-ratio: 240 / 164; padding: 6px; background: var(--paper); border-radius: 15%; box-shadow: 0 5px 0 #72644343; }
.cover-one { left: 1%; top: 8%; transform: rotate(-10deg); }
.cover-two { right: 0; bottom: 9%; transform: rotate(10deg); }
.cover-letter { position: absolute; right: 6%; top: 5%; display: grid; place-items: center; width: 21%; aspect-ratio: 1; background: var(--rose); border: 2px solid #e39b86; border-radius: 24%; color: #8b3e34; font-size: clamp(1.7rem, 6vw, 3.4rem); line-height: 1; font-weight: 900; box-shadow: 0 3px #e9ab99; transform: rotate(11deg); }
.cover-arrow { position: absolute; left: 5%; bottom: 12%; width: 13%; height: auto; aspect-ratio: 1; color: #315b4c; }
.cover-star { position: absolute; z-index: 2; color: #8b5519; }
.cover-star.left { left: 4%; top: 3%; width: 26px; height: 26px; }
.cover-star.right { right: 2%; bottom: 9%; width: 32px; height: 32px; color: #28614f; }
.station-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 49px; padding-inline: 4px; margin-bottom: 6px; }
.station-bar > .overline { background: #e8eddb; border: 1px solid #d2dbc4; padding: 5px 11px; border-radius: 999px; }
.station-card { padding: clamp(15px, 4.2vw, 34px); }
.station-card h1 { font-size: clamp(1.75rem, 5.7vw, 3.45rem); font-weight: 880; line-height: 1.04; letter-spacing: -.058em; }
.dots { display: flex; gap: 7px; align-items: center; }
.dot { width: 13px; height: 13px; border: 1px solid #b8baa8; border-radius: 50%; background: #fffdf4; }
.dot[data-done] { background: #7caf93; border-color: #50816b; }
.dot[data-current] { background: #f4c767; border: 2px solid #755418; }
.listen-cue { display: grid; grid-template-columns: minmax(125px, 1fr) minmax(0, 1fr); gap: clamp(5px, 2.4vw, 20px); align-items: center; margin: 15px 0 17px; padding: 8px 12px; min-height: 91px; border-radius: 19px; background: #fbf3da; border: 1px solid #ecdcb0; }
.cue-main { display: grid; justify-items: start; min-width: 0; }
.hear { min-height: 63px; font-size: clamp(.92rem, 3vw, 1.3rem); background: var(--gold); border-color: #dba74a; box-shadow: 0 3px #e1b558; padding-inline: clamp(7px, 2.1vw, 16px); position: relative; }
.hear > [data-icon] { width: 1.35em; height: 1.35em; }
.playing-tick { position: absolute; inset: 6px 6px auto auto; width: 6px; height: 6px; border-radius: 50%; background: #255447; opacity: 0; }
[data-playing] .playing-tick { opacity: 1; }
[data-playing] .bench-card .replay-key { box-shadow: inset 0 0 0 2px #7ca891; }
.cue-aside { display: grid; justify-items: start; align-content: center; }
.cue-aside p { font-weight: 700; font-size: clamp(.86rem, 2.5vw, 1.08rem); }
.mode-key { background: #fff9e9; border-color: #e5d4a8; font-size: .91rem; padding-inline: 10px; margin-top: 5px; min-height: 44px; }
.sample { display: flex; gap: 7px; align-items: center; min-height: 69px; }
.sample-label { display: grid; justify-items: center; align-content: center; gap: 4px; font-size: .69rem; font-weight: 750; }
.sample-label [data-icon] { width: 23px; height: 23px; }
.sample .art { width: clamp(73px, 15vw, 105px); aspect-ratio: 240 / 164; }
.pictures { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(5px, 1.4vw, 13px); }
.picture { position: relative; min-width: 0; min-height: 75px; display: grid; align-items: center; padding: clamp(2px, 1vw, 8px); border-radius: clamp(11px, 2vw, 19px); border: 2px solid #ded9c8; background: #fffaf1; box-shadow: 0 3px #e9e0cd; }
.picture .art { display: block; min-width: 0; }
.picture[data-missed] { border-style: dashed; border-color: #93651e; }
.picture[data-found] { border-color: #3e775e; background: #d4ebdc; box-shadow: 0 3px #9ec4ac; }
.pick-mark { position: absolute; right: 4px; bottom: 4px; display: none; place-items: center; padding: 2px; width: 24px; height: 24px; border-radius: 50%; color: white; background: #28624c; }
.picture[data-found] .pick-mark { display: grid; }
.feedback { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 62px; padding-top: 13px; }
.feedback p { color: var(--muted); font-weight: 690; }
.feedback strong { color: var(--green); font-weight: 900; font-size: 1.22em; }
.feedback .button { padding-inline: 12px; }
.finish-card { text-align: center; padding-block: clamp(38px, 7vw, 76px); }
.finish-seal { width: 72px; height: 72px; margin: 0 auto 18px; border: 2px solid #e2b050; background: var(--gold); color: #654c18; border-radius: 24px; transform: rotate(-9deg); }
.finish-seal svg { width: 41px; height: 41px; }
.finish-card > p { margin-top: 12px; color: var(--muted); }
.finish-actions { justify-content: center; }
.pairs { display: flex; gap: 6px; }
.pair-key { min-width: 65px; min-height: 44px; background: var(--paper); border-color: var(--line); font-size: .99rem; font-weight: 830; padding-inline: 10px; }
.pair-key[aria-pressed="true"] { color: #164839; background: var(--mint); border-color: #8cb8a5; box-shadow: 0 2px #b7d1c2; }
.bench-layout { display: grid; grid-template-columns: minmax(0, 1.13fr) minmax(240px, .87fr); align-items: stretch; gap: clamp(10px, 3vw, 29px); margin: 15px 0; }
.bench-art { display: grid; align-items: center; min-width: 0; height: clamp(207px, 28vw, 266px); padding: 4px; border-radius: 22px; background: #f9f3e1; border: 1px solid #ece1c3; }
.bench-art svg { min-height: 0; animation: wake .23s ease-out both; }
@keyframes wake { from { opacity: .63; transform: scale(.97); } to { opacity: 1; transform: scale(1); } }
.machine { display: grid; place-content: center; justify-items: center; gap: 6px; border: 1px solid #e6e0cf; border-radius: 22px; background: #fcf8e9; padding: 11px; min-width: 0; }
.word-line { display: flex; gap: 5px; align-items: stretch; color: var(--ink); font-weight: 900; font-size: clamp(2.8rem, 7vw, 4.1rem); line-height: 1; }
.letter-slot, .tail-slot { display: grid; place-items: center; height: 1.37em; border-radius: .24em; border: 2px solid transparent; }
.letter-slot { width: 1.27em; background: var(--rose); color: #863e35; border-color: #e7a798; box-shadow: 0 3px #ecb9a8; }
.tail-slot { width: 2.04em; letter-spacing: .03em; background: #dcece3; color: #285647; border-color: #b2d4c1; box-shadow: 0 3px #c7ded1; }
.letter-hint { display: flex; align-items: center; gap: 4px; margin-top: 4px; color: #4e5f52; font-size: .86rem; font-weight: 730; text-align: center; }
.letter-hint [data-icon] { color: #863e35; }
.letters { display: flex; gap: 9px; }
.letter-key { min-height: 53px; min-width: 68px; background: #ffebd9; border-color: #eabfa9; box-shadow: 0 2px #edd6bb; font-size: 1.62rem; font-weight: 900; color: #753e34; }
.letter-key[aria-pressed="true"] { background: #f5cbbb; border-color: #c78071; box-shadow: inset 0 0 0 1px #c78071; }
.replay-key { border-color: #bdcfbd; background: #edf4e8; min-height: 44px; font-size: .91rem; margin-top: 2px; }
.mission { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 83px; padding: 5px 13px; background: #f7eed6; border-radius: 17px; border: 1px solid #e9d8ae; }
.mission[data-free] { background: #e5f1e5; border-color: #c5dbc8; }
.mission-kicker { font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; font-weight: 840; color: #565e47; }
.mission-task { font-size: clamp(.91rem, 2.6vw, 1.18rem); font-weight: 790; }
.goal-art { width: clamp(86px, 16vw, 107px); flex: none; aspect-ratio: 240 / 164; }
.mission > .button { min-height: 44px; padding-inline: 9px; font-size: .88rem; }
@media (max-width: 620px) {
  .topbar { min-height: 64px; gap: 7px; }
  .brand { font-size: 17px; gap: 6px; }
  .brand-mark { width: 29px; height: 29px; }
  .home-card { grid-template-columns: 1fr; gap: 3px; padding: 23px 18px 12px; }
  .home-copy h1 { font-size: clamp(3.1rem, 10vw, 4.65rem); }
  .home-copy h1 br { display: none; }
  .home-actions { margin-top: 17px; gap: 8px; }
  .home-actions .button { padding-inline: 10px; min-height: 51px; }
  .lede { margin-top: 11px; max-width: 31ch; }
  .cover { width: min(100%, 320px); justify-self: center; height: clamp(192px, 51vw, 245px); }
  .cover-sticker { width: 61%; padding: 4px; }
  .station-bar { min-height: 43px; margin-bottom: 5px; padding-inline: 1px; }
  .station-card { border-radius: 21px; }
  .listen-cue { margin-block: 13px 12px; padding: 6px 7px; }
  .mode-key { padding-inline: 6px; font-size: .78rem; }
  .sample { gap: 3px; }
  .sample-label { font-size: .65rem; }
  .bench-layout { grid-template-columns: 1fr; margin-block: 10px; gap: 7px; }
  .bench-art { height: clamp(143px, 40vw, 178px); background: #f9f3e4; }
  .machine { padding: 6px 5px; gap: 4px; }
  .word-line { font-size: 2.43rem; }
  .letter-hint { margin-top: 0; }
  .letter-key { min-height: 48px; min-width: 68px; }
  .mission { min-height: 70px; padding-inline: 8px; }
}
@media (max-width: 360px) {
  .sound-key { padding-inline: 8px; }
  .sound-key > #sound-label { display: none; }
  .listen-cue { grid-template-columns: minmax(132px, 1fr) minmax(0, 1fr); }
  .hear { gap: .4em; padding-inline: 6px; }
  .sample-label { font-size: 0; }
  .sample .art { width: 91px; }
}
@media (max-width: 390px) {
  .pictures { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .picture { grid-column: span 2; }
  .picture:last-child { grid-column: 2 / span 2; }
}
@media (prefers-reduced-motion: reduce) {
  .bench-art svg { animation: none; }
}
  </style>
</head>
<body>
  <div class="shell" id="shell">
    <header class="topbar">
      <button type="button" id="go-home" class="button home-key" aria-label="В меню" title="В меню" hidden><span data-icon="back"></span></button>
      <div class="brand"><span class="brand-mark" data-icon="spark"></span><span>Буквоград <small>2.0</small></span></div>
      <button type="button" id="sound" class="button sound-key" aria-label="Звук" aria-pressed="true"><span id="sound-icon" data-icon="sound"></span><span id="sound-label">Звук</span></button>
    </header>

    <main>
      <section id="home-screen" aria-labelledby="home-title">
        <div class="home-card">
          <div class="home-copy">
            <p class="overline"><span data-icon="spark"></span> Семейная игра</p>
            <h1 id="home-title" tabindex="-1">Ожившие<br> слова<span class="title-dot">.</span></h1>
            <p class="lede">Послушай, найди картинку и оживи новое слово одной буквой.</p>
            <div class="home-actions">
              <button type="button" id="start-listen" class="button primary"><span data-icon="play"></span> Играть</button>
              <button type="button" id="start-bench" class="button secondary"><span data-icon="swap"></span> Мастерская</button>
            </div>
            <p class="home-progress" id="home-progress" hidden></p>
          </div>
          <div class="cover" aria-hidden="true">
            <div class="cover-orbit"></div><span class="cover-star left" data-icon="spark"></span><span class="cover-star right" data-icon="spark"></span>
            <div class="cover-sticker cover-one" id="cover-dom"></div>
            <div class="cover-sticker cover-two" id="cover-som"></div>
            <span class="cover-letter">А</span><span class="cover-arrow" data-icon="swap"></span>
          </div>
        </div>
      </section>

      <section id="listen-screen" aria-labelledby="listen-title" hidden>
        <div class="station-bar"><p class="overline"><span data-icon="sound"></span> Игра 1</p><div id="listen-dots" class="dots" role="img"></div></div>
        <div class="station-card listen-card">
          <h1 id="listen-title" tabindex="-1">Поймай картинку</h1>
          <div class="listen-cue">
            <div class="cue-main">
              <button type="button" id="hear" class="button hear"><span data-icon="sound"></span><span>Послушать</span><span class="playing-tick" aria-hidden="true"></span></button>
              <div id="sample" class="sample" hidden><span class="sample-label"><span data-icon="eye"></span> Образец</span><span id="sample-art" class="art" role="img" aria-label="Картинка-образец"></span></div>
            </div>
            <div class="cue-aside">
              <p id="listen-instruction">Послушай и выбери.</p>
              <button type="button" id="listen-mode" class="button mode-key"><span id="mode-icon" data-icon="eye"></span><span id="mode-label">По картинке</span></button>
            </div>
          </div>
          <div id="listen-choices" class="pictures" role="group" aria-label="Выбор картинки"></div>
          <div class="feedback">
            <p id="listen-feedback" role="status"></p>
            <button type="button" id="listen-next" class="button primary" hidden>Дальше <span data-icon="right"></span></button>
          </div>
        </div>
      </section>

      <section id="finish-screen" aria-labelledby="finish-title" hidden>
        <div class="station-bar"><p class="overline"><span data-icon="sound"></span> Игра 1</p></div>
        <div class="station-card finish-card">
          <div class="finish-seal" data-icon="check"></div>
          <h1 id="finish-title" tabindex="-1">Все картинки на месте!</h1>
          <p>Теперь попробуй оживить новые слова.</p>
          <div class="finish-actions">
            <button type="button" id="finish-bench" class="button primary"><span data-icon="swap"></span> В мастерскую</button>
            <button type="button" id="finish-again" class="button secondary"><span data-icon="again"></span> Ещё раз</button>
          </div>
        </div>
      </section>

      <section id="bench-screen" aria-labelledby="bench-title" hidden>
        <div class="station-bar bench-bar">
          <p class="overline"><span data-icon="swap"></span> Игра 2</p>
          <div class="pairs" role="group" aria-label="Выбор хвоста слова">
            <button type="button" class="button pair-key" data-pair="om" aria-pressed="true">…ОМ</button>
            <button type="button" class="button pair-key" data-pair="ak" aria-pressed="false">…АК</button>
          </div>
        </div>
        <div class="station-card bench-card">
          <h1 id="bench-title" tabindex="-1">Замени букву</h1>
          <div class="bench-layout">
            <div class="bench-art art" id="bench-art" aria-hidden="true"></div>
            <div class="machine">
              <div class="word-line" id="word-line" aria-live="polite" aria-atomic="true">
                <span class="letter-slot"><span id="word-first"></span></span><span class="tail-slot" id="word-tail" title="Хвост слова остаётся на месте"></span>
              </div>
              <p class="letter-hint"><span data-icon="up"></span> Выбери первую букву</p>
              <div id="letters" class="letters" role="group" aria-label="Первая буква"></div>
              <button type="button" id="bench-hear" class="button replay-key"><span data-icon="sound"></span> Послушать слово</button>
            </div>
          </div>
          <div class="mission" id="mission">
            <div class="mission-copy"><p class="mission-kicker" id="mission-kicker"></p><p class="mission-task" id="mission-task" role="status"></p></div>
            <div id="goal-art" class="goal-art art" role="img" aria-label="Картинка для превращения"></div>
            <button type="button" id="bench-again" class="button secondary" hidden><span data-icon="again"></span> Повторить</button>
          </div>
        </div>
      </section>
    </main>
    <noscript>Для игры включите JavaScript в браузере.</noscript>
    <audio id="voice" preload="none" hidden aria-hidden="true"></audio>
    <template id="art-dom"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 164" aria-hidden="true" focusable="false">
  <rect x="2" y="2" width="236" height="160" rx="25" fill="#ffe9ac"/>
  <circle cx="191" cy="37" r="15" fill="#ffd16a"/>
  <path d="M20 60c4-8 9-9 15-7 0-7 7-11 13-9 6 1 9 5 9 10 7-1 12 2 14 7z" fill="#fff5d3"/>
  <path d="M2 117c44-27 84-20 121-6 33 13 71 13 115-15v41a25 25 0 0 1-25 25H27a25 25 0 0 1-25-25z" fill="#c6d68a"/>
  <path d="M120 136l18-3 44 29h-75z" fill="#fff2c7"/>
  <ellipse cx="117" cy="139" rx="74" ry="10" fill="#b4c379"/>
  <path d="M159 43h19v44h-19z" fill="#e98b66" stroke="#603e39" stroke-width="3"/>
  <path d="M157 44h23v-7h-23z" fill="#f6a784" stroke="#603e39" stroke-width="3" stroke-linejoin="round"/>

'use strict';

// The same rules run in the standalone file and in the Node tests.
const Bukvograd = (() => {
  const SAVE_KEY = 'bukvograd-2-v1';
  const own = (obj, key) => typeof key === 'string' && Object.hasOwn(obj, key);
  const words = Object.freeze(Object.fromEntries([
    ['dom', 'ДОМ'], ['som', 'СОМ'], ['mak', 'МАК'], ['rak', 'РАК'],
  ].map(([id, text]) => [id, Object.freeze({id, text, letter: text[0], clip: `w_${id}`})])));
  const PAIRS = Object.freeze({
    om: Object.freeze({tail: 'ОМ', words: Object.freeze(['dom', 'som'])}),
    ak: Object.freeze({tail: 'АК', words: Object.freeze(['mak', 'rak'])}),
  });
  const LISTEN = [
    ['dom', 'mak', 'dom', 'som'], ['som', 'som', 'rak', 'dom'],
    ['mak', 'dom', 'rak', 'mak'], ['rak', 'mak', 'rak', 'som'],
  ].map(([target, ...choices]) => Object.freeze({target, choices: Object.freeze(choices)}));
  const CLIP_IDS = Object.freeze(['ph_listen', ...Object.values(words).map(w => w.clip)]);
  const isClipId = id => CLIP_IDS.includes(id);
  const word = id => own(words, id) ? words[id] : null;

  const startListening = () => ({index: 0, phase: 'pick', missed: null});
  const listeningRound = run => LISTEN[run.index] || null;
  function pickPicture(run, id) {
    const round = listeningRound(run);
    if (run.phase !== 'pick' || !round || !round.choices.includes(id)) return run;
    return id === round.target ? {...run, phase: 'found', missed: null} : {...run, missed: id};
  }
  function advanceListening(run) {
    if (run.phase !== 'found') return run;
    const index = run.index + 1;
    return {index, phase: index < LISTEN.length ? 'pick' : 'done', missed: null};
  }

  const startWorkshop = pair => own(PAIRS, pair) ? {pair, word: PAIRS[pair].words[0], step: 0} : null;
  const currentWord = bench => word(bench.word);
  const goalWord = bench => bench.step < 2 ? PAIRS[bench.pair].words[1 - bench.step] : null;
  function chooseLetter(bench, letter) {
    const id = PAIRS[bench.pair].words.find(id => word(id).letter === letter);
    if (!id || id === bench.word) return bench;
    return {...bench, word: id, step: bench.step + Number(id === goalWord(bench))};
  }

  function readSave(raw, local = {}, changedSetting) {
    let value;
    try { value = JSON.parse(raw); } catch { /* start fresh */ }
    const savedSolved = Array.isArray(value?.solved) ? value.solved : [];
    const localSolved = Array.isArray(local.solved) ? local.solved : [];
    return {
      muted: (changedSetting === 'muted' ? local.muted : value?.muted) === true,
      visual: (changedSetting === 'visual' ? local.visual : value?.visual) === true,
      listened: value?.listened === true || local.listened === true,
      solved: Object.keys(PAIRS).filter(id => savedSolved.includes(id) || localSolved.includes(id)),
    };
  }

  return Object.freeze({SAVE_KEY, PAIRS, LISTEN_COUNT: LISTEN.length, CLIP_IDS, isClipId, word,
    startListening, listeningRound, pickPicture, advanceListening,
    startWorkshop, currentWord, goalWord, chooseLetter, readSave});
})();

'use strict';

// One native media element owns both the current clip and the optional prompt queue.
function createVoice(media, bank, isClipId, onPlaying, onUnavailable) {
  let job = null;
  const allowed = id => isClipId(id) && Object.hasOwn(bank, id) &&
    typeof bank[id] === 'string' && bank[id].startsWith('data:audio/mpeg;base64,');

  function stop() {
    job = null;
    if (media.hasAttribute('src')) {
      media.pause();
      media.removeAttribute('src');
      media.load();
    }
    onPlaying(false);
  }

  function fail(expected) {
    if (job !== expected) return;
    stop();
    onUnavailable();
  }

  function start(expected) {
    onPlaying(false);
    try {
      media.src = expected.src = bank[expected.ids[expected.index]];
      Promise.resolve(media.play()).catch(() => fail(expected));
    } catch {
      fail(expected);
    }
  }

  const current = () => job && media.currentSrc === job.src;
  media.addEventListener('playing', () => {
    if (current() && !media.paused) onPlaying(true);
  });
  media.addEventListener('ended', () => {
    if (!current() || !media.ended) return;
    if (job.index + 1 < job.ids.length) {
      job = {...job, index: job.index + 1};
      start(job);
    } else stop();
  });
  media.addEventListener('error', () => {
    if (job && media.error && media.getAttribute('src') === job.src) fail(job);
  });

  function play(ids) {
    stop();
    if (!Array.isArray(ids) || !ids.length || ![...ids].every(allowed)) return false;
    job = {ids: ids.slice(), index: 0, src: ''};
    start(job);
    return true;
  }

  return {play, stop};
}

    if (listenRendered !== round) {
      const cards = round.choices.map((id, i) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'picture';
        button.dataset.choice = id;
        button.setAttribute('aria-label', `Картинка ${i + 1}`);
        const image = document.createElement('span');
        image.className = 'art';
        art(image, id);
        const mark = document.createElement('span');
        mark.className = 'pick-mark';
        mark.dataset.icon = 'check';
        icon(mark, 'check');
        button.append(image, mark);
        return button;
      });
      $('listen-choices').replaceChildren(...cards);
      listenRendered = round;
    }
    for (const b of $('listen-choices').children) {
      b.toggleAttribute('data-missed', b.dataset.choice === run.missed);
      b.toggleAttribute('data-found', found && b.dataset.choice === round.target);
      if (found) b.setAttribute('aria-disabled', 'true');
      else b.removeAttribute('aria-disabled');
    }
    $('listen-next').hidden = !found;
    if (found) {
      const w = M.word(round.target).text;
      if ($('listen-feedback').textContent !== `Да! ${w}`) {
        const strong = document.createElement('strong');
        strong.textContent = w;
        $('listen-feedback').replaceChildren('Да! ', strong);
      }
    } else text($('listen-feedback'), run.missed ? 'Попробуй ещё.' : 'Выбери картинку.');
  }

  function hearRound(prompt = false) {
    if (visualListen()) return;
    const clip = M.word(M.listeningRound(run).target).clip;
    voice.play(prompt ? ['ph_listen', clip] : [clip]);
  }
  function startListen() {
    run = M.startListening();
    show('listen');
    hearRound(true);
  }

  function renderBenchSound() {
    $('bench-hear').disabled = save.muted;
    $('bench-hear').title = save.muted ? 'Звук выключен' : audioFailed ? 'Попробовать звук снова' : '';
  }
  function renderBench() {
    const w = M.currentWord(bench);
    const pair = M.PAIRS[bench.pair];
    for (const b of document.querySelectorAll('[data-pair]')) b.setAttribute('aria-pressed', String(b.dataset.pair === bench.pair));
    text($('word-first'), w.letter);
    text($('word-tail'), pair.tail);
    art($('bench-art'), w.id);
    if (pairRendered !== bench.pair) {
      $('letters').replaceChildren(...pair.words.map(id => {
        const letter = M.word(id).letter;
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'button letter-key';
        b.dataset.letter = letter;
        b.textContent = letter;
        return b;
      }));
      pairRendered = bench.pair;
    }
    for (const b of $('letters').children) b.setAttribute('aria-pressed', String(b.dataset.letter === w.letter));
    const goal = M.goalWord(bench);
    const free = goal === null;
    $('mission').toggleAttribute('data-free', free);
    $('goal-art').hidden = free;
    $('bench-again').hidden = !free;
    if (goal) art($('goal-art'), goal);
    text($('mission-kicker'), free ? 'Превращения готовы' : `Шаг ${bench.step + 1} из 2`);
    text($('mission-task'), free ? 'Меняй как хочешь!' : bench.step ? 'Верни эту картинку' : 'Сделай такую картинку');
    renderBenchSound();
  }

  function hearBench() {
    if (!save.muted) voice.play([M.currentWord(bench).clip]);
  }
  function startBench() {
    bench = M.startWorkshop('om');
    show('bench');
    hearBench();
  }

  $('start-listen').addEventListener('click', startListen);
  $('finish-again').addEventListener('click', startListen);
  $('start-bench').addEventListener('click', startBench);
  $('finish-bench').addEventListener('click', startBench);
  $('go-home').addEventListener('click', () => show('home'));
  $('hear').addEventListener('click', () => hearRound());
  $('listen-mode').addEventListener('click', () => {
    if (save.muted) return;
    voice.stop();
    save.visual = !visualListen();
    audioFailed = false;
    persist('visual');
    renderListen();
    hearRound();
  });
  $('sound').addEventListener('click', () => {
    voice.stop();
    save.muted = !save.muted;
    if (!save.muted) audioFailed = false;
    persist('muted');
    renderSound();
    if (screen === 'listen') {
      renderListen();
      hearRound();
    }
    if (screen === 'bench') {
      renderBenchSound();
      hearBench();
    }
  });
  $('listen-choices').addEventListener('click', e => {
    const choice = e.target.closest('[data-choice]')?.dataset.choice;
    const next = M.pickPicture(run, choice);
    if (next === run) return;
    run = next;
    if (run.phase === 'found') voice.stop();
    renderListen();
    if (run.phase === 'found') $('listen-next').focus({preventScroll: true});
  });
  $('listen-next').addEventListener('click', () => {
    if (run.phase !== 'found') return;
    voice.stop();
    run = M.advanceListening(run);
    if (run.phase === 'done') {
      save.listened = true;
      persist();
      show('finish');
    } else {
      renderListen();
      $('listen-title').focus({preventScroll: true});
      hearRound();
    }
  });
  document.querySelector('.pairs').addEventListener('click', e => {
    const pair = e.target.closest('[data-pair]')?.dataset.pair;
    if (!pair) return;
    if (pair !== bench.pair) {
      bench = M.startWorkshop(pair);
      renderBench();
    }
    hearBench();
  });
  $('letters').addEventListener('click', e => {
    const letter = e.target.closest('[data-letter]')?.dataset.letter;
    if (!letter) return;
    bench = M.chooseLetter(bench, letter);
    if (bench.step === 2 && !save.solved.includes(bench.pair)) {
      save.solved.push(bench.pair);
      persist();
    }
    renderBench();
    hearBench();
  });
  $('bench-hear').addEventListener('click', () => {
    audioFailed = false;
    renderBenchSound();
    hearBench();
  });
  $('bench-again').addEventListener('click', () => {
    bench = M.startWorkshop(bench.pair);
    renderBench();
    $('letters').firstElementChild.focus({preventScroll: true});
    hearBench();
  });
  window.addEventListener('pagehide', voice.stop);
  document.addEventListener('visibilitychange', () => { if (document.hidden) voice.stop(); });
  art($('cover-dom'), 'dom');
  art($('cover-som'), 'som');
  renderHome();
  renderSound();
})();
  </script>
</body>
</html>
