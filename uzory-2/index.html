<style>
:root {
  color-scheme:light; --paper:#fffaf1; --ink:#302441; --soft:#6a5278;
  --edge:#e9d8c7; --night:#2c244a; --iris:#6e4394; --honey:#ffd36e;
  font-family:ui-rounded,'Arial Rounded MT Bold',system-ui,sans-serif;
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
body { margin:0; min-height:100vh; background:radial-gradient(ellipse at 10% 0,#f5e4f7 0,transparent 50%),#fbf1e2; color:var(--ink); }
h1,h2,h3,p { margin:0; }
button { font:inherit; color:inherit; border:0; -webkit-tap-highlight-color:transparent; touch-action:manipulation; user-select:none; }
button:enabled { cursor:pointer; }
button:focus-visible { outline:3px solid var(--iris); outline-offset:3px; }
button[disabled] { opacity:.45; }
.wrap { width:min(950px,calc(100% - 42px)); margin:auto; padding-top:max(18px,env(safe-area-inset-top)); padding-bottom:max(12px,env(safe-area-inset-bottom)); }
.mast { display:flex; align-items:center; gap:11px; margin-bottom:15px; }
.brand { width:52px; height:52px; flex:0 0 52px; }
.brand-title { min-width:0; }
.brand-title p { font-size:11px; color:var(--iris); text-transform:uppercase; letter-spacing:.09em; font-weight:850; }
h1 { font-size:clamp(23px,4.1vw,35px); line-height:1.05; letter-spacing:-.046em; }
h1 span { color:var(--iris); font-size:.57em; letter-spacing:0; white-space:nowrap; }
.nav { display:flex; align-items:center; gap:7px; margin-left:auto; }
.icon { width:22px; height:22px; flex:0 0 auto; fill:none; stroke:currentColor; stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
.icon-button { display:grid; place-items:center; width:47px; height:47px; border-radius:15px; background:var(--paper); border:1.5px solid var(--edge); }
.icon-button[aria-pressed='false'] { color:#685a73; }
.store-note { margin:-2px 2px 10px; font-size:13px; color:var(--soft); }
.hero-card { display:grid; grid-template-columns:minmax(0,1.07fr) minmax(0,.93fr); gap:16px; padding:24px; border:2px solid var(--edge); border-radius:27px; background:var(--paper); box-shadow:0 6px #edded2; }
.hero-text { align-self:center; padding:10px 0 10px 4px; }
.kicker { display:inline-flex; align-items:center; gap:5px; font-size:12px; color:#5a3a78; background:#f0e4fb; font-weight:850; letter-spacing:.02em; border-radius:10px; padding:5px 9px; }
.kicker .icon { width:16px; height:16px; }
.hero-text h2 { font-size:clamp(32px,5.1vw,50px); color:#392552; line-height:1.01; letter-spacing:-.055em; margin-top:10px; }
.hero-text p { color:var(--soft); line-height:1.42; margin-top:10px; font-size:clamp(14px,2.3vw,18px); font-weight:600; }
.hero-art { position:relative; display:grid; place-items:end center; min-height:227px; overflow:hidden; isolation:isolate; border-radius:20px; background:radial-gradient(ellipse at 48% 63%,#5a4376,var(--night) 75%); }
.hills { position:absolute; inset:auto 0 0; width:100%; height:100%; pointer-events:none; z-index:-1; }
.hero-art .firefly { width:min(210px,60%); margin:36px 0 4px 19px; filter:drop-shadow(0 4px 0 #392752); }
.hero-lights { display:flex; justify-content:space-evenly; position:absolute; inset:0 6% auto; margin:auto; max-width:330px; }
.hero-lights .lamp { width:min(18%,56px); }
.actions { margin-top:15px; display:flex; flex-wrap:wrap; gap:9px; }
.action {
  display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:48px;
  padding:8px 14px; border:2px solid transparent; border-radius:14px;
  font-weight:850; font-size:15px; text-align:center;
}
.primary { background:var(--honey); border-color:#e9b45d; box-shadow:0 3px #e8b168; color:#442957; }
.secondary { background:#eee4fa; color:#50336e; border-color:#decaed; }
.ghost { background:var(--paper); border-color:var(--edge); color:var(--soft); }
#done-stamp { margin-top:10px; color:#2f695d; font-weight:800; font-size:13px; }
.play-card { padding:17px; border-radius:25px; background:var(--paper); border:2px solid var(--edge); box-shadow:0 5px #edded2; }
.stage-head { display:flex; justify-content:space-between; gap:9px; align-items:center; margin-bottom:11px; }
.stage-head h2 { font-size:clamp(22px,4.2vw,32px); letter-spacing:-.035em; line-height:1.08; }
.stage-number { font-size:12px; font-weight:850; color:#725097; margin-bottom:3px; }
.stage-head h2:focus { outline:none; }
#help { min-width:47px; flex:0 0 auto; color:#7050a0; background:#f5ebfb; border-color:#e7d4f3; }
#help[aria-pressed='true'] { background:#fae5ad; border-color:#eac471; color:#6a3d58; }
.boards { display:grid; gap:8px; }
.board { position:relative; isolation:isolate; overflow:hidden; padding:8px 14px 9px; border-radius:18px; background:radial-gradient(ellipse at 48% 85%,#544069,#332650 79%); color:#fff7e6; }
.board[data-lit='true'] { background:radial-gradient(ellipse at 50% 65%,#68505c,#382858 86%); }
.board-label { position:relative; display:block; font-size:13px; color:#f2e7ff; margin:0 2px 2px; font-weight:800; }
.row { position:relative; display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:4px; margin:auto; width:min(100%,545px); }
.row::before { content:''; position:absolute; inset:5px 7% auto; border-top:1px solid #f0dafa6b; pointer-events:none; }
.row .piece, .paint, .slot { display:grid; place-items:center; min-width:0; }
.row .piece, .slot { position:relative; border-radius:11px; }
.row .piece { border:2px solid transparent; }
.slot { min-height:46px; padding:0; border:2px solid transparent; background:#271c4254; color:#e2cafa; }
.slot[data-lamp='blank'] { background:#4f3e7066; }
.slot[aria-pressed='true'] { border-color:#ffd978; background:#854d6f; box-shadow:inset 0 0 0 1px #bf86a4; }
.row .piece[data-reference='true'] { border-color:#ffd978; background:#f0bc753b; }
.slot:focus-visible { outline:3px solid #f1e9ff; outline-offset:-4px; }
.lamp { display:block; width:min(100%,62px); height:auto; color:#d9b5fa; }
.hero-lights .lamp { filter:drop-shadow(0 3px 8px #ffd57c42); }
.board[data-lit='true'] .lamp:not(.empty) { filter:drop-shadow(0 0 8px #ffd86bb2); animation:light-on .45s ease-out both; }
@keyframes light-on { from { transform:scale(.98); filter:drop-shadow(0 0 2px #ffdc8b7a); } to { transform:scale(1); filter:drop-shadow(0 0 8px #ffd86bb2); } }
#question[data-hint='true'] .piece, #sample[data-hint='true'] .piece { border-bottom-color:#ffd978; box-shadow:inset 0 -8px 16px #ffd97815; }
#question[data-hint='true'] .piece:nth-child(2n), #sample[data-hint='true'] .piece:nth-child(2n) { margin-inline-end:2px; }
#question[data-hint='true'] .lamp.empty { color:#ffdf8a; }
.notice { font-size:14px; line-height:1.28; color:var(--soft); font-weight:750; min-height:31px; margin:8px 2px 3px; }
.notice[data-tone='good'] { color:#21624d; }
.notice[data-tone='hint'] { color:#69468f; }
.control-bar { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:9px; }
.tray { display:flex; align-items:center; flex-wrap:wrap; gap:6px; }
.paint {
  padding:0 5px; min-width:57px; min-height:50px; background:#f3eafa;
  border-radius:13px; border:2px solid #e6d3f3;
}
.paint .lamp { width:44px; }
#next-step { margin-left:auto; }
.unit-edit { display:flex; align-items:center; flex-wrap:wrap; gap:5px; margin:3px 0; }
.unit-edit .slot { width:54px; height:57px; color:#d6b9fa; }
.unit-edit .lamp { width:47px; }
.results-row { display:flex; justify-content:center; flex-wrap:wrap; gap:7px; padding:0; }
.unit { position:relative; display:flex; gap:1px; border:1px solid #dcbaff7a; border-top:0; border-radius:0 0 10px 10px; padding:1px 2px 3px; }
.unit .lamp { width:clamp(22px,6.7vw,44px); }
.results-empty { color:#f1ddfb; margin:4px 0 8px; text-align:center; font-size:14px; font-weight:650; }
.free-tip { color:var(--soft); font-size:13px; line-height:1.25; margin-top:2px; }
footer { color:#7e6886; font-size:12px; text-align:center; margin-top:16px; }

  .action:enabled:hover, .icon-button:enabled:hover, .paint:enabled:hover { border-color:#9977bc; }

  .board { padding:4px 2px 4px; border-radius:13px; }
  .board-label { margin-inline:4px; }
  .row { gap:2px; }
  .row .slot { min-height:45px; }
  .notice { margin-top:5px; }
  .control-bar { gap:6px; }
}
@media (max-width:345px) {
  .wrap { width:calc(100% - 14px); }

  .action { padding-inline:8px; }

<script>
const PatternKit = (() => {
  'use strict';
  const COLORS = Object.freeze(['sun','blue','red','green']);
  const FREE_MAX = 4;
  const KEY = 'uzory-2-v1';
  const repeat = (unit, count) => Array.from({length: count}, () => unit).flat();
  const GUIDE_ROW = Object.freeze(repeat(['sun','blue'],3));
  const BUILD_ROW = Object.freeze(repeat(['red','green'],3));
  const valid = (value) => COLORS.includes(value);
  const inside = (i,n) => Number.isInteger(i) && i >= 0 && i < n;
  const guideAnswer = (lamp) => lamp === GUIDE_ROW[GUIDE_ROW.length-1];
  const newBuild = () => ({cells:Array(BUILD_ROW.length).fill(null),cursor:0});

  function selectBuild(draft, index) {
    return inside(index, draft.cells.length) ? {...draft, cursor:index} : draft;
  }
  function putBuild(draft, lamp) {
    if (!inside(draft.cursor, draft.cells.length) || !valid(lamp)) return draft;
    const cells = [...draft.cells];
    cells[draft.cursor] = lamp;
    const gap = cells.indexOf(null);
    return {cells,cursor:gap < 0 ? null : gap};
  }
  function checkBuild(draft) {
    const gap = draft.cells.indexOf(null);
    if (gap >= 0) return {kind:'empty',index:gap};
    const mistake = BUILD_ROW.findIndex((lamp,i) => lamp !== draft.cells[i]);
    return mistake < 0 ? {kind:'done',index:null} : {kind:'wrong',index:mistake};
  }
  function addFree(block, lamp, index=null) {
    if (!valid(lamp)) return block;
    if (index === null) return block.length < FREE_MAX ? [...block, lamp] : block;
    if (!inside(index,block.length)) return block;
    const next = [...block];
    next[index] = lamp;
    return next;
  }
  function removeFree(block, index=block.length-1) {
    return inside(index,block.length) ? block.filter((_,i) => i !== index) : block;
  }
  function readSave(raw) {
    const clean = {v:1,guided:false,built:false,sound:true,block:[]};
    if (typeof raw !== 'string' || raw.length > 4096) return clean;
    let saved;
    try { saved = JSON.parse(raw); } catch { return clean; }
    if (saved?.v !== 1) return clean;
    return {
      v:1, guided:saved.guided === true, built:saved.built === true, sound:saved.sound !== false,
      block:Array.isArray(saved.block) ? saved.block.slice(0,FREE_MAX).filter(valid) : [],
    };
  }
  return Object.freeze({COLORS,FREE_MAX,KEY,GUIDE_ROW,BUILD_ROW,repeat,guideAnswer,
    newBuild,selectBuild,putBuild,checkBuild,addFree,removeFree,readSave});
})();

    const d = designs[id];
    if (!d) return `<svg class="lamp empty" viewBox="0 0 80 88" aria-hidden="true" focusable="false"><path d="M40 4v14M26 22Q40 15 54 22L65 34V57Q57 72 40 72T15 57V34Z" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="4 5" stroke-linecap="round"/><path d="M36 40c1-5 12-5 11 1-.4 3-6 4-6 8m0 7h.01" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg>`;
    return `<svg class="lamp" viewBox="0 0 80 88" aria-hidden="true" focusable="false"><g stroke-linecap="round" stroke-linejoin="round"><path d="M40 3v15" stroke="#ceb5fa" stroke-width="3"/><path d="${d.body}" fill="${d.fill}" stroke="#292044" stroke-width="3.5"/><path d="${d.strokes}" stroke="${d.side}" fill="none" stroke-width="2.8"/><path d="${d.glint}" stroke="${d.shine}" fill="none" stroke-width="3.8"/><path d="M30 18h20l-3-5H33zM31 73h18v5H31z" fill="#fdf0bb" stroke="#39304e" stroke-width="2.6"/></g></svg>`;
  };
  const label = (id) => designs[id]?.label ?? 'пусто';
  const hero = () => `<svg class="firefly" viewBox="0 0 218 172" aria-hidden="true" focusable="false">
    <g stroke="#2e2550" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round">
      <path d="M115 81C101 45 135 17 161 25q21 7 11 32-13 26-57 36Z" fill="#9ae5cc"/>
      <path d="M105 86C91 51 65 30 44 41q-23 15 1 37 23 19 62 19Z" fill="#b8f1db"/>
      <path d="M139 54q7-14 21-18M76 71q-10-12-27-17" fill="none" stroke="#59ae9b"/>
      <path d="M113 97 Q142 92 153 117q10 27-23 36-33 8-48-12-10-14 .5-31Z" fill="#ffd36e"/>
      <path d="M105 105q3 23 32 36M126 99q4 17 24 25" fill="none" stroke="#df9c50" stroke-width="5"/>
      <path d="M91 119q8 13 28 17" fill="none" stroke="#ffecad" stroke-width="4"/>
      <path d="M71 87Q58 69 44 73m36-12Q79 39 64 31" fill="none"/>
      <circle cx="43" cy="73" r="4.5" fill="#ffd36e"/><circle cx="63" cy="31" r="4.5" fill="#ffd36e"/>
      <path d="M73 74Q96 60 117 72Q132 81 129 100Q128 123 103 126Q81 131 66 115Q51 102 58 88Q62 79 73 74Z" fill="#fff6e1"/>
      <path d="M77 98v3m31-5v3" stroke-width="4.7"/><path d="M89 109q5 5 10-1" fill="none"/>
      <path d="M69 107h4m39-3h5" stroke="#ee9389" stroke-width="3.8"/>
      <path d="M128 116q17-13 24-8m-59 17-13 8" fill="none"/>
    </g>
    <g fill="#ffeb9e"><path d="M186 82l2.8 7.2 7.2 2.8-7.2 2.8-2.8 7.2-2.8-7.2-7.2-2.8 7.2-2.8Z"/><circle cx="176" cy="123" r="2.6"/><circle cx="35" cy="113" r="3"/><path d="M32 41l1.6 4.4 4.4 1.6-4.4 1.6L32 53l-1.6-4.4-4.4-1.6 4.4-1.6Z"/></g>
  </svg>`;
  const hills = () => `<svg class="hills" viewBox="0 0 540 152" preserveAspectRatio="none" aria-hidden="true" focusable="false">
    <path fill="#3e3265" d="M0 81q90-46 181-7 58 24 118-5 122-59 241 17v66H0z"/>
    <path fill="#4d3a6d" d="M0 116q87-28 186 0 65 20 129-3 106-39 225 3v36H0z"/>
    <g fill="#67528b"><path d="m33 130 17-29 17 29zm447 4 15-28 15 28z"/><path d="m19 131 10-19 10 19zm491 7 10-18 10 18z"/></g>
    <g fill="#f7d996" opacity=".7"><circle cx="41" cy="32" r="1.7"/><circle cx="104" cy="25" r="2.2"/><circle cx="171" cy="58" r="1.6"/><circle cx="245" cy="26" r="1.3"/><circle cx="343" cy="31" r="1.7"/><circle cx="436" cy="20" r="2.4"/><circle cx="496" cy="50" r="1.7"/></g>
  </svg>`;
  return Object.freeze({icon,lamp,label,hero,hills});
})();
(() => {
  'use strict';
  const M = PatternKit;
  const A = PartyArt;
  const $ = (id) => document.getElementById(id);
  const view = $('view');
  const sound = $('sound');
  const home = $('back-home');
  const narrator = $('narrator');
  const voiceBank = new Map(Object.entries(JSON.parse($('voices').textContent)));
  let usableStorage = true;
  let saved = M.readSave(read());
  let screen = 'home', nextCorrect = false, lit = false, hint = false;
  let build = M.newBuild(), freeSelected = null;
  let notice = '', tone = '';

  function storageError() {
    usableStorage = false;
    $('store-note').hidden = false;
  }
  function read() {
    try { return localStorage.getItem(M.KEY); } catch { storageError(); return null; }
  }
  function save() {
    if (!usableStorage) return;
    try { localStorage.setItem(M.KEY,JSON.stringify(saved)); } catch { storageError(); }
  }
  function stopVoice() {
    narrator.pause();
    if (narrator.hasAttribute('src')) {
      narrator.removeAttribute('src');
      narrator.load();
    }
    delete narrator.dataset.clip;
  }
  function speak(clip) {
    stopVoice();
    if (!saved.sound || !voiceBank.has(clip)) return;
    narrator.dataset.clip = clip;
    narrator.src = voiceBank.get(clip);
    narrator.play().catch(() => {});
  }
  function soundButton() {
    sound.setAttribute('aria-pressed',String(saved.sound));
    sound.innerHTML = A.icon(saved.sound?'sound':'mute');
    sound.title = saved.sound?'Выключить озвучку':'Включить озвучку';
  }
  function mark(message, kind='') { notice = message; tone = kind; }
  function action(id,text,icon,style='primary') {
    return `<button id="${id}" class="action ${style}" type="button" data-act="${id}" data-focus="${id}">${A.icon(icon)}<span>${text}</span></button>`;
  }
  function poster() {
    const lamps=['sun','blue','red','green','sun'].map(A.lamp).join('');
    return `<section class="hero-card" aria-labelledby="screen-title">
      <div class="hero-text"><span class="kicker">${A.icon('star')} Вечер со светлячком</span>
        <h2 id="screen-title" tabindex="-1">Зажжём огоньки!</h2><p>Продолжи узор, собери гирлянду по образцу, а потом придумай свою.</p>
        <div class="actions">${action('start-lesson','Играть','play')}${action('start-free','Моя гирлянда','star','secondary')}</div>
        ${saved.built?'<p id="done-stamp">✓ Праздник уже зажигался</p>':''}
      </div>
      <div class="hero-art" aria-hidden="true">${A.hills()}<div class="hero-lights">${lamps}</div>${A.hero()}</div>
    </section>`;
  }
  function heading(title, tag, help=false) {
    return `<div class="stage-head"><div><p class="stage-number">${tag}</p><h2 id="screen-title" tabindex="-1">${title}</h2></div>${help?
      `<button type="button" class="icon-button" id="help" data-act="help" data-focus="help" aria-label="Подсказка" title="Подсказка" aria-pressed="${hint}">${A.icon('bulb')}</button>`:''}</div>`;
  }
  const piece = (lamp, reference=false) => `<span class="piece" data-lamp="${lamp??'blank'}"${reference===true?' data-reference="true"':''} role="img" aria-label="${A.label(lamp)}">${A.lamp(lamp)}</span>`;
  function slot(lamp,index,isActive,kind) {
    return `<button type="button" class="slot" data-act="${kind}-slot" data-slot="${index}" data-focus="${kind}-${index}"
      data-lamp="${lamp??'blank'}" aria-pressed="${isActive}" aria-label="Место ${index+1}: ${A.label(lamp)}">${A.lamp(lamp)}</button>`;
  }
  function tray(ids) {
    return `<div id="paint-tray" class="tray" role="group" aria-label="Фонарики">${ids.map(lamp=>
      `<button type="button" class="paint" data-act="paint" data-paint="${lamp}" data-focus="paint-${lamp}" aria-label="${A.label(lamp)}">${A.lamp(lamp)}</button>`).join('')}</div>`;
  }
  function board(id,label,tiles,{light=false,highlight=false,editor=false}={}) {
    return `<section id="${id}" class="board" data-lit="${light}" data-hint="${highlight}" aria-label="${label}">
      ${A.hills()}<span class="board-label">${label}</span><div class="row"${editor?' role="group" aria-label="Места для фонариков"':''}>${tiles}</div></section>`;
  }
  function text() { return `<p id="notice" class="notice" data-tone="${tone}" role="status">${notice}</p>`; }
  function nextPage() {
    const row = nextCorrect ? M.GUIDE_ROW : [...M.GUIDE_ROW.slice(0,-1),null];
    return `<section class="play-card">${heading('Что дальше?','1 / 2 · Продолжи узор',!nextCorrect)}
      ${board('question','Какой фонарик дальше?',row.map(piece).join(''),{light:nextCorrect,highlight:hint})}
      ${text()}<div class="control-bar">${nextCorrect?action('next-step','Дальше','arrow'):tray(['sun','blue'])}</div>
    </section>`;
  }
  function buildPage() {
    const sample = M.BUILD_ROW.map((lamp,i) => piece(lamp,!lit&&i===build.cursor)).join('');
    return `<section class="play-card">${heading('Собери гирлянду','2 / 2 · Собери по образцу',!lit)}
      <div class="boards">${board('sample','Образец',sample,{highlight:hint})}
      ${board('learner','Твоя гирлянда',build.cells.map((lamp,i)=>slot(lamp,i,i===build.cursor,'build')).join(''),{light:lit,editor:true})}</div>
      ${text()}<div class="control-bar">${lit?action('free-after','Моя гирлянда','star'):tray(['red','green'])+action('check','Проверить','check')}</div>
    </section>`;
  }
  function freePage() {
    const block = saved.block;
    const copies = M.repeat(block,3);
    const units = block.length ? Array.from({length:3},(_,i)=>`<div class="unit" aria-label="Повтор ${i+1}">${copies.slice(i*block.length,(i+1)*block.length).map(piece).join('')}</div>`).join('') : '<p class="results-empty">Здесь появятся повторы</p>';
    const edit = [...block,...Array(M.FREE_MAX-block.length).fill(null)].map((lamp,i)=>
      lamp?slot(lamp,i,i===freeSelected,'free'):`<span class="slot ghost-slot" aria-hidden="true">${A.lamp(null)}</span>`).join('');
    return `<section class="play-card">${heading('Моя гирлянда','Свободная игра',true)}
      <div class="boards"><section class="board free-board" aria-label="Кусочек узора"><span class="board-label">Твой кусочек · ${block.length} / ${M.FREE_MAX}</span>
        <div id="unit-edit" class="unit-edit">${edit}</div></section>
        <section id="repeat" class="board free-board" aria-label="Три повтора" data-lit="${!!block.length}">${A.hills()}<span class="board-label">Так он повторяется</span><div class="results-row">${units}</div></section></div>
      ${text()}<div class="control-bar">${tray(M.COLORS)}${block.length?action('free-delete','Убрать','remove','ghost'):''}</div>
    </section>`;
  }
  function render(focus) {
    const previous = document.activeElement?.closest('[data-focus]')?.dataset.focus;
    view.dataset.mode = screen;
    view.innerHTML = screen==='home'?poster():screen==='next'?nextPage():screen==='build'?buildPage():freePage();
    home.hidden = screen === 'home';
    const restore = focus ?? previous;
    if (restore === 'heading') $('screen-title').focus({preventScroll:true});
    else if (restore) [...view.querySelectorAll('[data-focus]')].find(el=>el.dataset.focus===restore)?.focus({preventScroll:true});
  }
  function enter(screenName,message,clip) {
    screen = screenName;
    hint = false;
    mark(message);
    render('heading');
    window.scrollTo(0,0);
    if (clip) speak(clip);
    else stopVoice();
  }
  function enterFree() {
    freeSelected = null;
    enter('free','Нажимай фонарики и смотри, как повторяется твой кусочек.');
  }
  function paint(lamp) {
    if (!M.COLORS.includes(lamp)) return;
    if (screen==='next' && !nextCorrect) {
      if (!M.guideAnswer(lamp)) {
        hint = true;
        mark('Попробуй ещё. Посмотри, как огоньки чередуются.','hint');
        render(); speak('ph_again'); return;
      }
      nextCorrect = true; hint = false;
      if (!saved.guided) { saved.guided = true; save(); }
      mark('Верно! Узор продолжился.','good');
      render('next-step'); speak('ph_done');
    } else if (screen==='build' && !lit) {
      const next = M.putBuild(build,lamp);
      if (next===build) mark('Нажми на фонарик, который хочешь поменять.','hint');
      else {
        build = next;
        mark(build.cursor===null?'Нажми «Проверить» или поменяй любой фонарик.':'Поставь следующий фонарик.');
      }
      render();
    } else if (screen==='free') {
      const block = M.addFree(saved.block,lamp,freeSelected);
      if (block !== saved.block) {
        saved.block = block; freeSelected = null; save();
        mark('Хочешь поменять фонарик? Нажми на него в своём кусочке.');
      } else mark('В кусочке уже четыре фонарика. Можно поменять или убрать любой.','hint');
      render();
    }
  }
  function check() {
    if (screen!=='build' || lit) return;
    const result = M.checkBuild(build);
    if (result.kind==='done') {
      lit = true;
      if (!saved.built) { saved.built=true; save(); }
      build = {...build,cursor:null};
      mark('Огоньки зажглись! Можно их поменять или собрать свой узор.','good');
      render('free-after'); speak('ph_done'); return;
    }
    build = M.selectBuild(build,result.index);
    mark(result.kind==='empty'?'Здесь пока пусто. Поставь фонарик.':'Поменяй отмеченный фонарик — посмотри на образец.','hint');
    render(); speak('ph_again');
  }
  function help() {
    hint = !hint;
    mark(screen==='next'?'Посмотри на пары: один огонёк, потом другой.':screen==='build'?'Смотри на верхний ряд. Внизу нужны такие же фонарики.':'Делай кусочек из одного, двух, трёх или четырёх фонариков.','hint');
    render();
    if (hint && screen !== 'free') speak('ph_hint');
  }
  view.addEventListener('click',event=>{
    const button = event.target.closest('button[data-act]');
    if (!button || button.disabled) return;
    switch(button.dataset.act) {
      case 'start-lesson':
        nextCorrect=false; enter('next','Выбери фонарик, которого не хватает.','ph_what'); break;
      case 'next-step':
        if (screen==='next' && nextCorrect) {
          build=M.newBuild(); lit=false;
          enter('build','Нажимай на фонарики, чтобы поставить их в нижний ряд.','ph_intro');
        }
        break;
      case 'start-free': case 'free-after': enterFree(); break;
      case 'help': help(); break;
      case 'paint': paint(button.dataset.paint); break;
      case 'check': check(); break;
      case 'build-slot':
        lit=false; build=M.selectBuild(build,Number(button.dataset.slot));
        mark('Выбери фонарик для отмеченного места.'); render(); break;
      case 'free-slot':
        freeSelected=Number(button.dataset.slot); mark('Выбери другой фонарик или нажми «Убрать».'); render(); break;
      case 'free-delete':
        saved.block=M.removeFree(saved.block,freeSelected??saved.block.length-1);
        freeSelected=null; save(); mark('Добавь фонарик или выбери тот, который хочешь поменять.'); render(); break;
    }
  });
  home.innerHTML = A.icon('home');
  home.title = 'На главный экран';
  home.addEventListener('click',()=>enter('home',''));
  sound.addEventListener('click',()=>{
    saved.sound=!saved.sound; save(); soundButton();
    if (!saved.sound) stopVoice();
    else if (screen==='next'&&!nextCorrect) speak('ph_what');
    else if (screen==='build'&&!lit) speak('ph_intro');
  });
  soundButton(); render();
})();
</script>
</body>
</html>
