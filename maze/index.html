canvas.onpointerdown=e=>{if(won||homeVisible)return;let c=center(pos)[2],x=pad+visual.x*c,y=pad+visual.y*c,p=point(e);anchor=p;gestureStarted=performance.now();if(Math.hypot(p[0]-x,p[1]-y)<c*.95){pointer=e.pointerId;canvas.setPointerCapture(e.pointerId)}audio?.resume();e.preventDefault()};
canvas.onpointermove=e=>{if(e.pointerId!==pointer||won)return;let p=point(e);for(let k=0;k<maze.n*2;k++){let[x,y,c]=center(planned()),dx=p[0]-x,dy=p[1]-y;if(Math.max(Math.abs(dx),Math.abs(dy))<c*.47)break;let horizontal=Math.abs(dx)>Math.abs(dy),d=horizontal?(dx>0?1:3):(dy>0?2:0);if(!move(d)){let alt=horizontal?(dy>0?2:0):(dx>0?1:3);if(Math.min(Math.abs(dx),Math.abs(dy))<c*.47||!move(alt))break}}};
canvas.onpointerup=e=>{if(anchor&&!won){let p=point(e),dx=p[0]-anchor[0],dy=p[1]-anchor[1],distance=Math.max(Math.abs(dx),Math.abs(dy)),d=Math.abs(dx)>Math.abs(dy)?dx>0?1:3:dy>0?2:0;if(pointer===null&&distance>20)glide(d);else if(performance.now()-gestureStarted<230&&distance>center(pos)[2]*.65)glide(d,true)}pointer=null;anchor=null};canvas.onpointercancel=()=>{pointer=null;anchor=null};
document.addEventListener('keydown',e=>{if($('picker').open||homeVisible)return;let d={ArrowUp:0,ArrowRight:1,ArrowDown:2,ArrowLeft:3}[e.key];if(d!==undefined){e.preventDefault();if(!e.repeat)glide(d)}});
$('next').onclick=()=>load((level+1)%60);function muteUI(){$('mute').textContent=save.muted?'🔇':'🔊';$('mute').ariaLabel=save.muted?'Включить звук':'Выключить звук'}$('mute').onclick=()=>{save.muted=!save.muted;persist();muteUI()};muteUI();
function showHome(){homeVisible=true;pointer=null;anchor=null;document.body.classList.add('homeMode');$('homeArt').innerHTML=[0,3,7].map(i=>`<img src="${heroImages[i].src}" alt="">`).join('');$('play').querySelector('span').textContent=pos>0||save.unlocked>1?'Продолжить':'Играть';$('homeGrid').replaceChildren();levels.forEach((_,i)=>{let b=document.createElement('button');b.className=i===level?'current':'';b.ariaLabel=`Лабиринт ${i+1}: ${themes[themeOrder[i]].hero}`;b.innerHTML=`<img alt="" src="${heroImages[themeOrder[i]].src}">${i+1}<small>${i<save.unlocked?themes[themeOrder[i]].collect+' '+(save.counts[i]||0):'🔒'}</small>`;b.disabled=i>=save.unlocked;b.onclick=()=>{if(i!==level||won)load(i);showGame()};$('homeGrid').append(b)});window.scrollTo(0,0);persist()}
function showGame(){homeVisible=false;document.body.classList.remove('homeMode');lastAction=Date.now();applyTheme();draw();window.scrollTo(0,0)}
$('levels').onclick=showHome;$('play').onclick=()=>{if(won)load(Math.min(59,level+1));showGame()};$('close').onclick=()=>$('picker').close();
let hold=null,held=false;function cancel(){clearTimeout(hold);$('back').classList.remove('holding')}$('back').onpointerdown=e=>{e.preventDefault();held=false;$('back').setPointerCapture(e.pointerId);$('back').classList.add('holding');hold=setTimeout(()=>{held=true;location.href=$('back').href},1000)};$('back').onpointerup=()=>{cancel();if(!held){$('help').textContent='Удерживай, чтобы выйти';setTimeout(()=>$('help').textContent='',2200)}};$('back').onpointercancel=cancel;$('back').onclick=e=>e.preventDefault();$('back').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();location.href=$('back').href}};
Promise.all([...heroImages,...goalImages,...heroBlinkImages].map(i=>i.decode().catch(()=>{}))).then(()=>{load(Math.min(save.unlocked-1,Number(save.level)||0));showHome();function tick(t){frameTime=t;let dt=lastTick?(t-lastTick)/1000:0;lastTick=t;if(!document.hidden&&!homeVisible){advance(dt);draw()}requestAnimationFrame(tick)}requestAnimationFrame(tick)});
window.mazeGame={levels,themes,themeOrder,load,move,glide,solution,advance,showHome,showGame,get state(){return{level,pos,won,homeVisible,queue:[...queue],visual:{...visual},segment,n:maze.n,w:maze.w,h:maze.h,collected:collected.size}},draw};
