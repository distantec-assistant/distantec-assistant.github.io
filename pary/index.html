<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Найди пару</title>
<meta name="theme-color" content="#fff8ed">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='6' y='14' width='46' height='62' rx='10' fill='%23f7bd43' transform='rotate(-8 29 45)'/%3E%3Crect x='46' y='22' width='46' height='62' rx='10' fill='%237cc9a8' transform='rotate(8 69 53)'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:ui-rounded,'Arial Rounded MT Bold','Nunito',system-ui,sans-serif;background:#fff8ed;color:#574d70;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body:before{content:'';position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 10% 5%,#ffe5e7,transparent 45%),radial-gradient(ellipse at 100% 95%,#d9f4ee,transparent 50%)}
button{border:0;font:inherit;color:inherit;cursor:pointer;background:none;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:3px solid #e76f69;outline-offset:2px}
.screen{position:fixed;inset:0;display:none;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen.on{display:flex}
header.bar{display:flex;align-items:center;gap:8px;padding:10px 12px 6px;width:min(100%,760px);margin:0 auto}
header.bar h1{flex:1;margin:0;font-size:clamp(19px,5vw,25px);text-align:center;letter-spacing:-.5px}
.ib{width:52px;height:52px;border-radius:18px;background:#fff;box-shadow:0 4px 0 #ece3d9;display:grid;place-items:center;flex:none}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 #ece3d9}
.ib svg{width:28px;height:28px}
footer.foot{text-align:center;padding:6px 0 10px;font-size:13px;min-height:36px}
#back{position:relative;color:#9a8b9e;text-decoration:none;touch-action:none;user-select:none;padding:6px 10px;display:inline-block}
#back:after{content:'';position:absolute;height:2px;background:#9a8b9e;bottom:2px;left:10px;right:10px;transform:scaleX(0);transform-origin:left}
#back.holding:after{transform:scaleX(1);transition:transform 1s linear}
#help{display:block;height:15px;font-size:12px;color:#b5a6b3}
#footer{position:fixed;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom);z-index:5;display:none;background:linear-gradient(transparent,#fff8edee 40%)}
body.playing #footer{display:block}
/* home */
#home{align-items:center;justify-content:center;text-align:center;padding:20px}
#home h2{font-size:clamp(46px,13vw,76px);margin:6px 0 0;letter-spacing:-2px;color:#574d70}
#home h2 span{color:#e76f69}
#home p{margin:8px 0 26px;color:#9a8b9e;font-size:16px}
.homeBack{color:#9a8b9e;text-decoration:none;font-size:14px;padding:6px 10px}
@keyframes pulse{50%{transform:scale(1.08)}}
/* station */
#station header.bar{padding-bottom:2px}
#dots{display:flex;gap:8px;flex:1;justify-content:center}
#dots i{width:20px;height:20px;border-radius:50%;background:#efe5da;display:block;transition:.3s}
#dots i.ok{background:#7cc9a8}#dots i.now{background:#f7bd43;transform:scale(1.25)}
#stLetter{font-size:30px;font-weight:800;width:52px;height:52px;border-radius:18px;background:#ffe8a3;display:grid;place-items:center;box-shadow:0 4px 0 #efd27a;flex:none}
#stage{flex:1;position:relative;width:min(100%,760px);margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 12px 56px;min-height:0}
@keyframes wobble{20%{margin-left:-10px}40%{margin-left:9px}60%{margin-left:-6px}80%{margin-left:4px}}
.spark{position:absolute;width:12px;height:12px;border-radius:50%;pointer-events:none;animation:spark .6s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
/* fx layer */
#fx{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
#fx .spark{position:fixed;margin:-6px 0 0 -6px}
#fx .spark.star{border-radius:2px;transform:rotate(45deg)}
/* reward */
#reward{align-items:center;justify-content:center;text-align:center;background:#fff8edf2;z-index:10;overflow:hidden}
#reward strong{font-size:clamp(28px,8vw,40px);margin:14px 0 22px;display:block}
#rewardSticker{width:min(60vw,260px);height:min(60vw,260px);border-radius:50%;background:#fff;box-shadow:0 10px 0 #ece3d9,0 0 0 10px #ffe8a3;padding:22px;position:relative;margin:0 auto;animation:stickerIn .9s cubic-bezier(.3,1.6,.5,1)}
#rewardSticker svg{width:100%;height:100%}
#rewardSticker i{position:absolute;right:-6px;bottom:-6px;width:70px;height:70px;border-radius:50%;background:#e76f69;color:#fff;font-style:normal;font-size:42px;font-weight:800;display:grid;place-items:center;box-shadow:0 4px 0 #c4544f}
@keyframes stickerIn{from{transform:scale(0) rotate(-200deg)}}
#rewardNext{margin-top:28px;width:120px;height:86px;border-radius:28px;background:#7cc9a8;color:#fff;font-size:46px;box-shadow:0 7px 0 #5aa587}
@media(max-height:560px){#rewardSticker{width:min(38vh,260px);height:min(38vh,260px);padding:14px}#rewardSticker i{width:52px;height:52px;font-size:30px}#reward strong{margin:10px 0 12px;font-size:28px}#rewardNext{margin-top:8px;height:70px}}
#confetti{position:absolute;inset:0;pointer-events:none}
#confetti i{position:absolute;top:-30px;width:12px;height:18px;border-radius:3px;animation:fall 3s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.fade-in{animation:fadeIn .35s}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}}
@keyframes bigpop{40%{transform:scale(1.25) rotate(-4deg)}}
/* ---------- Найди пару ---------- */
#home{padding:12px 16px 40px;gap:4px}
#home h2{margin:0}
#home p{margin:2px 0 14px}
.hero{display:flex;gap:14px;justify-content:center;margin-bottom:6px;perspective:700px}
.hero .mc{width:var(--hc);height:var(--hc);pointer-events:none}
#home{--hc:min(22vw,12svh,104px)}
.tiles{display:grid;grid-template-columns:repeat(3,var(--t));gap:var(--tg);justify-content:center;--t:min(29vw,calc((100svh - 330px)/2.3),200px);--tg:min(3.4vw,16px)}
.tile{width:var(--t);border-radius:26px;background:#fff;box-shadow:0 6px 0 #ece3d9;padding:9% 8% 8%;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 #ece3d9}
.tile .ic{width:78%;aspect-ratio:1;display:grid;place-items:center}
.tile .ic svg{width:100%;height:100%}
.tile .ic b{font-size:calc(var(--t)*.36);font-weight:800;line-height:1;color:#e76f69}.tile .ic b i{font-style:normal;color:#5b8def;font-size:.8em}
.tile .td{display:flex;gap:4px}.tile .td i{width:9px;height:9px;border-radius:50%;background:#efe5da}.tile .td i.ok{background:#7cc9a8}
.tile.last{box-shadow:0 6px 0 #ece3d9,0 0 0 4px #ffd34d}
.tile .tt{font-size:clamp(11px,calc(var(--t)*.1),15px);font-weight:700;color:#9a8b9e;text-align:center;line-height:1.1;min-height:2.2em;display:flex;align-items:center}
@media(orientation:landscape){.tiles{grid-template-columns:repeat(6,var(--t));--t:min(14.5vw,calc((100svh - 190px)/1.45),190px)}#home{--hc:min(12vw,13svh,96px)}}
@media(orientation:portrait) and (max-aspect-ratio:1/2){.tiles{grid-template-columns:repeat(2,var(--t));--t:min(42vw,calc((100svh - 300px)/3.7),190px)}}
@media(max-height:500px){#home h2{font-size:38px}#home p{display:none}.hero{display:none}.tiles{--t:min(14.5vw,calc((100svh - 120px)/1.45),160px)}}
/* board */
#stage{padding:6px 8px 46px}
.board{display:grid;grid-template-columns:repeat(var(--c),var(--s));gap:var(--g);justify-content:center;align-content:center;perspective:900px}
.mc{width:var(--s);height:var(--s);padding:0;perspective:700px;position:relative}
.mc-in{position:relative;display:block;width:100%;height:100%;transition:transform .5s cubic-bezier(.45,1.45,.55,1);transform-style:preserve-3d}
.mc.up .mc-in,.mc.ok .mc-in{transform:rotateY(180deg)}
.mc.back .mc-in{transition:transform .7s cubic-bezier(.5,.1,.3,1)}
.mc-b,.mc-f{position:absolute;inset:0;border-radius:calc(var(--s)*.16);backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;box-shadow:0 5px 0 #0000001a}
.mc-b{background:var(--bk,#f7bd43);border:4px solid #fff}
.mc-b:before{content:'';position:absolute;inset:9%;border-radius:calc(var(--s)*.11);background:radial-gradient(circle,#ffffff66 0 16%,transparent 18%) 0 0/calc(var(--s)*.22) calc(var(--s)*.22);border:2px dashed #ffffff99}
.mc-b svg{width:38%;height:38%;position:relative}
.mc-f{background:#fff;transform:rotateY(180deg);padding:11%}
.mc-f svg{width:100%;height:100%}
.mc-f b{font-size:calc(var(--s)*.62);font-weight:800;color:#e76f69;line-height:1}
.mc.ok .mc-f{background:#e3f6ee;box-shadow:0 5px 0 #a8dcc6,0 0 0 4px #7cc9a8}
.mc.ok{animation:hop .6s cubic-bezier(.3,1.6,.5,1) .45s both}
@keyframes hop{0%{transform:none}35%{transform:translateY(-14%) scale(1.08)}70%{transform:translateY(2%) scale(.97)}100%{transform:none}}
.mc.deal{animation:deal .45s cubic-bezier(.3,1.5,.5,1) both}
@keyframes deal{from{transform:translateY(30px) scale(.4);opacity:0}}
.board.win .mc{animation:wave .7s ease-in-out both}
@keyframes wave{40%{transform:translateY(-12%) rotate(-4deg)}}
/* reward: compact in landscape */
#rewardBtns{display:flex;gap:16px;justify-content:center;align-items:center}
#rewardHome{width:86px;height:86px;border-radius:28px;background:#fff;box-shadow:0 7px 0 #ece3d9;display:grid;place-items:center;margin-top:28px}
#rewardHome svg{width:40px;height:40px}
#rewardStars{display:flex;gap:6px;justify-content:center;margin-top:14px}#rewardStars i{width:14px;height:14px;border-radius:50%;background:#efe5da}#rewardStars i.ok{background:#7cc9a8}
@media(max-height:560px){#reward{flex-direction:row;gap:48px}#reward #rewardSticker{margin:0}#reward strong{margin:0 0 6px}#rewardHome{margin-top:8px;height:70px;width:70px}#rewardStars{margin:4px 0 6px}}
</style></head>

function stopVoice(){token++;if(curSrc){const s=curSrc,g=curG;curSrc=null;curG=null;curId=null;if(!s.__stopped){s.__stopped=true;window.__voice.active--}try{const t=AC.currentTime;g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(g.gain.value,t);g.gain.linearRampToValueAtTime(0,t+.03);s.stop(t+.035)}catch(e){try{s.stop()}catch(_){}}}}
const voicePlaying=id=>!!curSrc&&curId===id;
async function say(ids){stopVoice();const t=token;for(const id of [].concat(ids)){if(t!==token)return false;if(typeof id==='number'){await wait(id);continue}const b=await loadClip(id);if(t!==token)return false;if(!b)continue;if(AC.state!=='running'){try{await Promise.race([AC.resume(),wait(600)])}catch(e){}if(t!==token)return false}await new Promise(res=>{let done=false;const fin=()=>{if(!done){done=true;res()}};try{const s=AC.createBufferSource();s.buffer=b;s.playbackRate.value=1;if(s.detune)s.detune.value=0;const g=AC.createGain();g.gain.value=1;s.connect(g);g.connect(VBUS);const V=window.__voice;V.active++;V.starts++;V.max=Math.max(V.max,V.active);V.rates.push(s.playbackRate.value);s.onended=()=>{if(!s.__stopped){s.__stopped=true;V.active--}if(curSrc===s){curSrc=null;curG=null;curId=null}if(!curSrc)duck(false);fin()};curSrc=s;curG=g;curId=id;duck(true);s.start();setTimeout(()=>{if(!done){/* the clip did not finish on the audio clock (context stalled): cut it so clips never pile up */try{s.stop()}catch(_){}if(!s.__stopped){s.__stopped=true;V.active--}if(curSrc===s){curSrc=null;curG=null;curId=null}fin()}},b.duration*1000+350)}catch(e){fin()}})}return t===token}
window.__sfx={};let NOISE=null;function sfx(kind){window.__sfx[kind]=(window.__sfx[kind]||0)+1;const c=AC;if(!c||c.state!=='running')return;if(kind==='pop'){try{if(!NOISE){NOISE=c.createBuffer(1,Math.round(c.sampleRate*.08),c.sampleRate);const d=NOISE.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3)}const t=c.currentTime,n=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();n.buffer=NOISE;f.type='bandpass';f.frequency.value=1800;f.Q.value=.8;g.gain.value=.35;n.connect(f);f.connect(g);g.connect(SBUS);n.start(t)}catch(e){}return}try{const t=c.currentTime,o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(SBUS);o.type=kind==='bad'?'triangle':'sine';const F={pop:[620,980,.14],good:[520,780,.18],bad:[220,170,.22],tick:[880,880,.05],win:[523,1046,.5],step:[440,520,.08]}[kind]||[500,600,.1];o.frequency.setValueAtTime(F[0],t);o.frequency.exponentialRampToValueAtTime(F[1],t+F[2]*.8);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(kind==='bad'?.05:.06,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+F[2]);o.start(t);o.stop(t+F[2]+.05);if(kind==='win'){[659,784,1046].forEach((f,k)=>{const o2=c.createOscillator(),g2=c.createGain();o2.connect(g2);g2.connect(SBUS);o2.frequency.value=f;const s=t+.12*(k+1);g2.gain.setValueAtTime(.0001,s);g2.gain.exponentialRampToValueAtTime(.05,s+.02);g2.gain.exponentialRampToValueAtTime(.0001,s+.35);o2.start(s);o2.stop(s+.4)})}}catch(e){}}
const praise=()=>'ph_'+pick(DATA.praise);
/* ---------- instructions / idle ---------- */
let instr=[],idleT=null;
function setInstr(ids,speak=true){instr=ids;if(speak)say(ids);poke()}
function poke(){clearTimeout(idleT);if($('station').classList.contains('on'))idleT=setTimeout(()=>{if(instr.length)say(instr);poke()},15000)}
document.addEventListener('pointerdown',poke,{capture:true});
$('repeat').onclick=()=>{if(instr.length)say(instr)};
/* hold-to-exit */
let hold=null,held=false;function cancelHold(){clearTimeout(hold);$('back').classList.remove('holding')}
$('back').onpointerdown=e=>{e.preventDefault();held=false;try{$('back').setPointerCapture(e.pointerId)}catch(_){}$('back').classList.add('holding');hold=setTimeout(()=>{held=true;location.href=$('back').href},1000)};
$('back').onpointerup=()=>{cancelHold();if(!held){$('help').textContent='Удерживай, чтобы выйти';setTimeout(()=>$('help').textContent='',2200)}};
$('back').onpointercancel=cancelHold;$('back').onclick=e=>e.preventDefault();
$('back').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();location.href=$('back').href}};
/* ---------- art ---------- */
const HOME='<svg viewBox="0 0 24 24" fill="none" stroke="#574d70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5l9-7 9 7" /><path d="M5 9.5V21h5v-6h4v6h5V9.5" fill="#ffe8a3"/></svg>';
document.querySelectorAll('.ib').forEach(b=>{if(b.innerHTML.trim()==='HOMEICON')b.innerHTML=HOME});
function burstAt(el,n=12){if(REDUCED)return;const r=el.getBoundingClientRect(),fx=$('fx');for(let k=0;k<n;k++){const s=document.createElement('i');const a=k/n*6.283+Math.random()*.4,d=50+Math.random()*40;s.style.cssText=`left:${r.left+r.width/2}px;top:${r.top+r.height/2}px;background:${pick(['#f7bd43','#e76f69','#7cc9a8','#8fb4ff','#e6a8ff'])};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px`;s.className=k%3?'spark':'spark star';fx.appendChild(s);setTimeout(()=>s.remove(),700)}}
/* ================= Найди пару ================= */
const THEMES=[...DATA.themes.map(t=>({...t,kind:'pics',levels:DATA.levels.length})),{id:'bukvy',title:'Буква и картинка',kind:'letters',levels:DATA.letterLevels.length}];
const LETTERS=Object.fromEntries(DATA.letters.map(l=>[l.id,l]));
const BACKS={zveri:'#f7a35c',eda:'#e76f69',transport:'#5b8def',veschi:'#b48ae6',priroda:'#7cc9a8',bukvy:'#f7bd43'};
/* ---------- save: {done:{theme:{level:1}}, next:{theme:level}, last:theme, pl:{theme:plays}} ---------- */
const KEY='pary-v1';
const okObj=x=>x&&typeof x==='object'&&!Array.isArray(x);
let save={v:1,done:{},next:{},last:null,pl:{}};
try{const o=JSON.parse(localStorage.getItem(KEY)||'{}');if(okObj(o)){for(const k of ['done','next','pl'])if(okObj(o[k]))save[k]=o[k];if(THEMES.some(t=>t.id===o.last))save.last=o.last}}catch(e){}
for(const t of THEMES){if(!okObj(save.done[t.id]))save.done[t.id]={};const n=+save.next[t.id];save.next[t.id]=Number.isInteger(n)&&n>=0&&n<t.levels?n:0}
const store=()=>{try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}};
const lvDone=(t,l)=>!!save.done[t][l];
/* ---------- navigation ---------- */
let screen='home',gameRun=0,TH=null,LV=0;
function show(id){screen=id;document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));document.body.classList.toggle('playing',id!=='home');if(id!=='station'){clearTimeout(idleT);gameRun++}}
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{stopVoice();goHome()});
/* ---------- home: theme tiles ---------- */
const backSVG='<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z" fill="#fff" opacity=".9"/></svg>';
function cardHTML(front,n,bk,cls=''){return `<button class="mc ${cls}" data-n="${n}" style="--bk:${bk}" aria-label="Карточка"><span class="mc-in"><span class="mc-b">${backSVG}</span><span class="mc-f">${front}</span></span></button>`}
function goHome(){show('home');
 $('tiles').innerHTML=THEMES.map(t=>`<button class="tile${save.last===t.id?' last':''}" data-t="${t.id}" aria-label="${t.title}"><span class="ic">${t.kind==='letters'?'<b>А<i>а</i></b>':picSVG(t.icon)}</span><span class="tt">${t.title}</span><span class="td">${Array.from({length:t.levels},(_,l)=>`<i class="${lvDone(t.id,l)?'ok':''}"></i>`).join('')}</span></button>`).join('');
 $('tiles').querySelectorAll('.tile').forEach(b=>b.onclick=()=>{unlockAudio();startLevel(b.dataset.t,save.next[b.dataset.t],true)})}
/* the two hero cards on the home screen flip back and forth */
function hero(){const ps=['kot','yabloko'];$('hero').innerHTML=ps.map((p,k)=>cardHTML(picSVG(p),k,['#f7a35c','#7cc9a8'][k])).join('');$('hero').style.setProperty('--s','var(--hc)');
 let k=0;if(!REDUCED)setInterval(()=>{if(screen!=='home')return;const c=$('hero').children[k%2];c.classList.toggle('up');k++},1300)}
/* ---------- level ---------- */
function pairsOf(t,l){if(t.kind==='letters')return DATA.letterLevels[l].map(id=>{const L=LETTERS[id];return {key:id,a:{type:'l',L},b:{type:'p',p:L.w},match:'lp_'+id}});
 const n=DATA.levels[l];return shuffle(t.pics).slice(0,n).map(p=>({key:p,a:{type:'p',p},b:{type:'p',p},match:'n_'+p}))}
const sideHTML=s=>s.type==='l'?`<b>${s.L.ch}</b>`:picSVG(s.p);
const sideClip=s=>s.type==='l'?'name_'+s.L.id:'n_'+s.p;
/* the biggest square cards that fit the stage without scrolling */
function layout(n){const st=$('stage'),cs=getComputedStyle(st);const W=st.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),H=st.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
 let best=null;for(let c=1;c<=n;c++){const r=Math.ceil(n/c);if(r*c-n>=c)continue;const g=Math.max(8,Math.min(16,Math.min(W,H)*.025));const s=Math.min((W-g*(c-1))/c,(H-g*(r-1))/r-6,230);const sc=s-(r*c!==n?6:0);if(!best||sc>best.sc)best={c,r,g,s:Math.floor(s),sc}}
 st.style.setProperty('--c',best.c);st.style.setProperty('--s',best.s+'px');st.style.setProperty('--g',best.g+'px');return best}
function drawDots(){const t=TH;$('dots').innerHTML=Array.from({length:t.levels},(_,l)=>`<i class="${lvDone(t.id,l)?'ok':''} ${l===LV?'now':''}"></i>`).join('')}
async function startLevel(tid,l,fromHome){const t=THEMES.find(x=>x.id===tid);TH=t;LV=l;save.last=tid;store();show('station');drawDots();
 const run=++gameRun;const pairs=pairsOf(t,l);const cards=shuffle(pairs.flatMap((p,k)=>[{k,s:p.a},{k,s:p.b}]));
 preload([...new Set(cards.map(c=>sideClip(c.s)).concat(pairs.map(p=>p.match),['ph_find','ph_find_l','ph_more','ph_done','t_'+tid],DATA.praise.map(p=>'ph_'+p)))]);
 const st=$('stage');st.innerHTML='';const lay=layout(cards.length);
 st.innerHTML=`<div class="board" id="board">${cards.map((c,n)=>cardHTML(sideHTML(c.s),n,BACKS[tid],'deal')).join('')}</div>`;
 const els=[...st.querySelectorAll('.mc')];els.forEach((e,n)=>e.style.animationDelay=(REDUCED?0:n*55)+'ms');
 const first=(save.pl[tid+':'+l]||0)===0;
 const ins=[t.kind==='letters'?'ph_find_l':'ph_find'];
 st.dataset.g='level:'+tid+':'+l+':'+run;
 await say([...(fromHome?['t_'+tid,250]:[]),...(l>0&&first&&t.kind==='pics'?['ph_more',250]:[])]);if(!alive(run))return;
 /* the smallest levels show all the pictures for a moment first */
 const peek=t.kind==='pics'&&l<=1;let busy=true;
 if(peek){els.forEach(e=>e.classList.add('up'));await wait(REDUCED?400:900+pairs.length*450);if(!alive(run))return;els.forEach(e=>{e.classList.remove('up');e.classList.add('back')});await wait(450)}
 setInstr(ins);busy=false;els.forEach(e=>e.classList.remove('deal'));
 let open=[],got=0;window.__level={cards:cards.map(c=>c.k),open:()=>open.length,busy:()=>busy,got:()=>got,n:pairs.length,run};
 els.forEach(el=>el.onclick=async()=>{if(busy||el.classList.contains('up')||el.classList.contains('ok')||!alive(run))return;
  const c=cards[+el.dataset.n];el.classList.remove('back');el.classList.add('up');sfx('step');open.push(el);
  if(open.length<2){say(sideClip(c.s));return}
  busy=true;const [a,b]=open;open=[];
  if(a.dataset.n!==b.dataset.n&&cards[+a.dataset.n].k===cards[+b.dataset.n].k){
   const p=pairs[c.k];await wait(380);if(!alive(run))return;a.classList.add('ok');b.classList.add('ok');sfx('good');burstAt(a,10);burstAt(b,10);got++;
   await say(p.match);if(!alive(run))return;
   if(got===pairs.length){await finishLevel(run,t,l,pairs,els);return}
   if(got%2===0&&got<pairs.length)say(praise());busy=false}
  else{await say(sideClip(c.s));if(!alive(run))return;await wait(450);if(!alive(run))return;sfx('tick');a.classList.add('back');b.classList.add('back');a.classList.remove('up');b.classList.remove('up');await wait(500);busy=false}});
}
const alive=run=>run===gameRun&&screen==='station';
function confetti(){const c=$('confetti');c.innerHTML='';if(REDUCED)return;for(let n=0;n<40;n++){const i=document.createElement('i');i.style.cssText=`left:${Math.random()*100}%;background:${pick(['#f7bd43','#e76f69','#7cc9a8','#8fb4ff','#e6a8ff'])};animation-delay:${Math.random()*1.2}s;animation-duration:${2.4+Math.random()*1.6}s`;c.appendChild(i)}}
async function finishLevel(run,t,l,pairs,els){const b=$('board');await wait(300);b.classList.add('win');els.forEach((e,n)=>e.style.animationDelay=(n*60)+'ms');sfx('win');await wait(900+els.length*60);if(!alive(run))return;
 save.done[t.id][l]=1;save.pl[t.id+':'+l]=(save.pl[t.id+':'+l]||0)+1;const nx=l+1<t.levels?l+1:0;save.next[t.id]=nx;store();
 const last=pairs[pairs.length-1];$('rewardSticker').innerHTML=t.kind==='letters'?`<b style="font-size:min(30vw,130px);color:#e76f69;font-weight:800;display:grid;place-items:center;height:100%">${last.a.L.ch}</b>`:picSVG(last.key);
 $('rewardStars').innerHTML=Array.from({length:t.levels},(_,k)=>`<i class="${lvDone(t.id,k)?'ok':''}"></i>`).join('');
 show('reward');confetti();say(['ph_done',300,praise()]);setTimeout(()=>{if(screen==='reward')burstAt($('rewardSticker'),18)},650);
 $('rewardNext').onclick=()=>{stopVoice();if(l+1<t.levels)startLevel(t.id,l+1,false);else goHome()};
 $('rewardHome').onclick=()=>{stopVoice();goHome()}}
$('rewardHome').innerHTML=HOME;
addEventListener('resize',()=>{if(screen==='station'&&$('board'))layout($('board').children.length);if(screen==='home')goHome()});
hero();goHome();
window.PG={THEMES,get save(){return save},get state(){return {screen,TH:TH&&TH.id,LV}},startLevel,pairsOf};

</script>
</body></html>
